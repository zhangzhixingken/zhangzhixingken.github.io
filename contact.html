  <style>
    :root {
      --paper: rgb(238, 234, 233);
      --ink: rgb(22, 20, 19);
      --muted: rgba(22, 20, 19, 0.56);
      --sans: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .visually-hidden {
      position: absolute !important;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Email and Instagram sit together in the lower-left corner, same size, same sans as the nav. */
    .contact {
      position: fixed;
      left: 33.333vw;
      bottom: 44px;
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 14px;
    }

    .contact a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      line-height: 1;
      letter-spacing: 0;
      color: var(--ink);
      transition: color 180ms ease;
    }

    .contact a:hover,
    .contact a:focus-visible { color: var(--muted); outline: none; }

    .contact svg { width: 14px; height: 14px; flex: 0 0 14px; }

    @media (max-width: 840px) {
      .contact { left: 18px; bottom: 28px; }
    }
  </style>
