  <style>
    :root {
      --paper: rgb(238, 234, 233);
      --ink: rgb(22, 20, 19);
      --accent: #37332e;
      --muted: rgba(22, 20, 19, 0.56);
      --serif: "Sorts Mill Goudy", Georgia, "Times New Roman", serif;
      --sans: "Helvetica Neue", Helvetica, Arial, "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    .contact {
      min-height: 100svh;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 120px 24px 96px;
      text-align: center;
    }

    .contact-label {
      margin: 0 0 clamp(36px, 5vw, 64px);
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .contact-email {
      position: relative;
      display: inline-block;
      max-width: 100%;
      font-family: var(--serif);
      font-size: clamp(28px, 6.2vw, 104px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .contact-email::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -0.06em;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 520ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .contact-email:hover::after,
    .contact-email:focus-visible::after { transform: scaleX(1); }
    .contact-email:focus-visible { outline: none; }

    .contact-actions {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 44px;
      margin: clamp(40px, 5vw, 64px) 0 0;
      padding: 0;
      list-style: none;
    }

    .contact-actions a,
    .contact-actions button {
      display: inline-block;
      padding: 6px 0;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .contact-actions a:hover,
    .contact-actions button:hover,
    .contact-actions a:focus-visible,
    .contact-actions button:focus-visible { color: var(--ink); outline: none; }

    .contact-actions .handle { text-transform: none; letter-spacing: 0.01em; }

    /* Entrance */
    .contact > * {
      opacity: 0;
      transform: translateY(14px);
      animation: contact-in 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .contact > :nth-child(2) { animation-delay: 90ms; }
    .contact > :nth-child(3) { animation-delay: 180ms; }

    @keyframes contact-in { to { opacity: 1; transform: none; } }

    @media (max-width: 840px) {
      .contact { padding: 96px 18px 80px; }
      .contact-actions { flex-direction: column; gap: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .contact > * { opacity: 1; transform: none; animation: none; }
      .contact-email::after { transition: none; }
    }
  </style>

    <h1 class="contact-label">Contact</h1>
    <a class="contact-email" href="mailto:contact@zhixingzhang.com">contact@<wbr>zhixingzhang.com</a>

      <li><button type="button" class="contact-copy" data-copy="contact@zhixingzhang.com" aria-live="polite">Copy address</button></li>
      <li><a href="https://www.instagram.com/zhixing_gallery/" target="_blank" rel="noopener">Instagram&nbsp;&nbsp;<span class="handle">@zhixing_gallery</span>&nbsp;↗</a></li>
    </ul>
  </main>

  <script>
    (() => {
      const button = document.querySelector(".contact-copy");
      if (!button) return;
      const label = button.textContent;
      let timer = 0;
      const fallbackCopy = (text) => {
        const field = document.createElement("textarea");
        field.value = text;
        field.setAttribute("readonly", "");
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        try { document.execCommand("copy"); } finally { field.remove(); }
      };
      button.addEventListener("click", async () => {
        const text = button.dataset.copy;
        try { await navigator.clipboard.writeText(text); } catch (error) { fallbackCopy(text); }
        button.textContent = "Copied";
        clearTimeout(timer);
        timer = setTimeout(() => { button.textContent = label; }, 1800);
      });
    })();
  </script>
